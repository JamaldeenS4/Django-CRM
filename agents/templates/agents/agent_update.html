{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<section class="text-gray-600 body-font overflow-hidden">
  <div class="container px-5 py-24 mx-auto">
    <div class="lg:w-4/5 mx-auto flex flex-wrap">
        <div class="lg:w-1/2 w-full lg:pr-10 lg:py-6 mb-6 lg:mb-0">
            <h2 class="text-sm title-font text-gray-500 tracking-widest">AGENT</h2>
            <h1 class="text-gray-900 text-3xl title-font font-medium mb-4">{{ agent.user.username }}</h1>
            <div class="flex mb-4">
                <a href="{% url 'agents:detail' agent.id %}" class="flex-grow border-b-2 border-gray-300 py-2 text-lg px-1">
                    Overview
                </a>
                <a class="flex-grow border-b-2 border-gray-300 py-2 text-lg px-1">
                    Reviews
                </a>
                <a href="{% url 'agents:update' agent.id %}" class="flex-grow text-indigo-500 border-b-2 border-indigo-500 py-2 text-lg px-1">
                    Update Details
                </a>
            </div>
            <div class="max-w-lg mx-auto w-full">
                <form method="post" class="mt-5">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-5 flex gap-3">
                        <button type="submit" class="flex-1 text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md">submit</button>
                        <a href="{% url 'agents:delete' agent.id %}" class="flex-1 text-center text-white bg-red-500 hover:bg-red-600 px-3 py-2 rounded-md">
                            DELETE
                        </a>
                    </div>
                </form>
            </div>
        </div>
      <img alt="ecommerce" class="lg:w-1/2 w-full lg:h-auto h-64 object-cover object-center rounded" src="https://dummyimage.com/400x400">
    </div>
  </div>
</section>
{% endblock content %}
