{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<a class="hover:text-blue-500" href="{% url 'leads:list' %}">Go back to leads</a>
<div class="max-w-lg mx-auto w-full">
    <div class="py-5 border-t border-gray-200">
        <h1 class="text-4xl text-gray-800">Are you sure you want to delete this lead?</h1>
    </div>
  
    <form method="post" class="mt-5">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md" type="submit">Yes, delete</button>
    </form>

</div>
{% endblock content %}
