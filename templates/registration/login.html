{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-lg mx-auto w-full">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md" type="submit">LOGIN</button>
    </form> 
    <div class="mt-3 py-3 border-t border-gray-200">
            <a class="hover:text-blue-500 mt-3" href="{% url 'reset-password' %}">Forgot password?</a>
    </div> 
</div>
{% endblock content %}
