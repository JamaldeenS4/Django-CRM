{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-lg mx-auto w-full">
    <h1 class="text-4xl text-gray-800">Enter your new password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md" type="submit">Confirm new Password</button>
    </form>
</div>
{% endblock content %}
