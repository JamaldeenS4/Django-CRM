{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}

<div class="max-w-lg mx-auto w-full">
    <h4 class="text-4xl text-gray-800">Reset your password</h4>
    <form method="post" class="mt-5">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md" type="submit">Reset password</button>
    </form>
    <div class="flex justify-between mt-5">
        <a href="{% url 'signup' %}">Don't have an account?</a>
        <a href="{% url 'login' %}">Already have an account?</a>
    </div>

</div>
{% endblock content %}
