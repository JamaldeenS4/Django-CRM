{% extends 'base.html' %}
{% load tailwind_filters %}

{% block content %}
<div class="max-w-lg mx-auto w-full">
    <p class="text-sm text-gray-600 mb-4">Create an organizer account to manage leads and agents for your organization.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="w-full text-white bg-blue-500 hover:bg-blue-600 px-3 py-2 rounded-md mb-5" type="submit">SIGNUP</button>
    </form> 
</div> 

{% endblock content %}
